name: NodeJS Reusable Pipeline

on:
  workflow_call:
    inputs:
      message:
        description: "Message from caller"
        required: true
        type: string

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Show pipeline information
        run: |
          echo "================================"
          echo "NodeJS Reusable Pipeline"
          echo "================================"
          echo "Message: ${{ inputs.message }}"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Runner hostname: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "================================"

      - name: Check NodeJS
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t github-actions-app:${{ github.sha }} .
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin \
          627407462345.dkr.ecr.us-east-1.amazonaws.com    