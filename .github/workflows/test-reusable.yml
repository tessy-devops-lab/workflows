name: Test Reusable Workflow

on:
  workflow_call:
    inputs:
      message:
        description: "Message from caller"
        required: true
        type: string

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Test reusable workflow
        run: |
          echo "================================"
          echo "Reusable workflow is working!"
          echo "Message: ${{ inputs.message }}"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "================================"
