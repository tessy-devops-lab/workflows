name: NodeJS Reusable Pipeline

on:
  workflow_call:
    inputs:
      message:
        description: "Message from caller"
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name"
        required: true
        type: string

      aws_region:
        description: "AWS region"
        required: true
        type: string

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Show pipeline information
        run: |
          echo "================================"
          echo "NodeJS Reusable Pipeline"
          echo "================================"
          echo "Message: ${{ inputs.message }}"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Runner hostname: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "================================"

      - name: Check NodeJS
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t ${{ inputs.ecr_repository }}:${{ github.sha }} .

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ inputs.aws_region }}| \
          docker login --username AWS --password-stdin \
          627407462345.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com

      - name: Tag Docker image
        run: |
          docker tag ${{ inputs.ecr_repository }}:${{ github.sha }} \
          627407462345.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push 627407462345.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}

      - name: Deploy application
        run: |
          docker pull 627407462345.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}

          docker stop ${{ inputs.ecr_repository }} || true
          docker rm ${{ inputs.ecr_repository }} || true

          docker run -d \
            --name ${{ inputs.ecr_repository }} \
            -p 3000:3000 \
            627407462345.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}


      - name: Verify deployment
        run: |
          echo "Checking application container..."
          docker ps --filter "name=${{ inputs.ecr_repository }}"

          echo "Waiting for application to become ready..."

          for i in {1..10}; do
            if curl --fail http://localhost:3000; then
              echo "Deployment verification successful!"
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/10"
            sleep 2
          done

          echo "Deployment verification failed!"
          docker logs ${{ inputs.ecr_repository }}
          exit 1
